server:
  port: ${PORT:8080}

spring:
  application:
    name: springFlix
  datasource:
    url: jdbc:postgresql://localhost:5433/app
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    locale: pt_BR
    locale-resolver: fixed

jwt:
  secret: ${JWT_SECRET:springflix-segredo-desenvolvimento}
  expiration-hours: 2

ia:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    temperature: 0.2
    timeout-seconds: 30
    log-requests: true
    log-responses: true
