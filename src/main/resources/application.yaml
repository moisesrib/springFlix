spring:
  application:
    name: springFlix
  datasource:
    url: jdbc:postgresql://localhost:5433/app
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    locale: pt_BR
    locale-resolver: fixed

jwt:
  secret: ${JWT_SECRET:springflix-segredo-desenvolvimento}
  expiration-hours: 2
